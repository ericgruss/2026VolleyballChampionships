/* Layout: single narrow column. Picker = pools grid; team view = day bands, one match per row with W/L toggles */
:root{
  --bg:#f5f6f8; --card:#ffffff; --fg:#17202e; --muted:#5f6b7c; --line:#dde2e9;

  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161e; --card:#1a212c; --fg:#e8ecf2; --muted:#98a3b3; --line:#2c3543;
  --accent:#f07a3e; --accent-soft:#3a2418; --win:#4cc183; --win-soft:#173225; --loss:#ef7a72; --loss-soft:#3a1c1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161e; --card:#1a212c; --fg:#e8ecf2; --muted:#98a3b3; --line:#2c3543;
  --accent:#f07a3e; --accent-soft:#3a2418; --win:#4cc183; --win-soft:#173225; --loss:#ef7a72; --loss-soft:#3a1c1b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{max-width:620px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:.02em}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{font:600 13px var(--body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 10px;cursor:pointer}
.linkbtn:hover{color:var(--fg);border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.record{display:flex;gap:8px;align-items:baseline;margin-top:10px;font-variant-numeric:tabular-nums}
.record b{font-family:var(--display);font-size:26px}
.meta{color:var(--muted);font-size:13px}
.day{display:grid;gap:8px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--fg);padding-bottom:4px}
.dayhead span{color:var(--muted);font-size:13px;text-align:right}
.match{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.match.w{background:var(--win-soft);border-color:var(--win)}
.match.l{background:var(--loss-soft);border-color:var(--loss)}
.match.ghost{background:transparent;border-style:dashed}
.time{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.time small{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em}
.info{min-width:0}
.opp{font-weight:700}
.tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:1px}
.wl{display:flex;gap:6px}
.wl button{font:700 14px var(--display);width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.wl button[data-v="w"][aria-pressed="true"]{background:var(--win);border-color:var(--win);color:#fff}
.wl button[data-v="l"][aria-pressed="true"]{background:var(--loss);border-color:var(--loss);color:#fff}
.seeds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seeds button{font-family:var(--display);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 4px;cursor:pointer;color:var(--fg);display:grid;gap:2px}
.seeds button b{font-size:22px;line-height:1}
.seeds button span{font-size:12px;color:var(--muted);letter-spacing:.05em}
.seeds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seeds button[aria-pressed="true"] span{color:#fff}
.hint{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:6px;padding:8px 10px}
.ref{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:440px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--muted)}
td:first-child{font-weight:700;white-space:nowrap}
.venues{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.venues b{color:var(--fg)}
footer{font-size:12px;color:var(--muted);display:grid;gap:4px;border-top:1px solid var(--line);padding-top:12px}
footer a{color:var(--muted)}
/* picker */
.search{width:100%;box-sizing:border-box;font:16px var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.pools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pool{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.pool h3{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 2px;color:var(--accent)}
.team{all:unset;cursor:pointer;padding:6px 8px;margin:0 -8px;border-radius:6px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.team:hover,.team:focus-visible{background:var(--accent-soft)}
.team span{color:var(--muted);font-weight:400}
.empty{color:var(--muted);font-size:14px}
.mates{font-size:13px;color:var(--muted)}
@media (max-width:380px){.match{grid-template-columns:54px 1fr auto;gap:8px;padding:10px}.time{font-size:18px}}

  const m=/^([A-Z])#(\d)$/.exec(s);if(m)return`Pool ${m[1]} #${m[2]}`;
  const id=s.slice(1),x=BR.find(b=>b.id===id);
  return`${s[0]==="W"?"Winner":"Loser"} of Match ${id}`+(x?` (${shortSrc(x.a)} / ${shortSrc(x.b)})`:"");
}
function shortSrc(s){const m=/^([A-Z])#(\d)$/.exec(s);return m?`${m[1]} #${m[2]}`:`${s[0]}${s.slice(1)}`}
const findBy=src=>BR.find(b=>b.a===src||b.b===src);
const other=(m,src)=>m.a===src?m.b:m.a;
const label=m=>`Div ${m.div} ${ROUND[m.round]}`+(/^\d+$/.test(m.id)?` · Match ${m.id}`:"");
const where=m=>`${EVENT.venues[m.v].name} · Court ${m.ct}`;
const timeHTML=t=>{const[h,ap]=t.split(" ");return`${h}<small>${ap}</small>`};

function row(key,m,opp,tag,trackable=true){
  const v=S[key];
  return`<div class="match ${trackable&&v?v:""} ${trackable?"":"ghost"}">
    <div class="time">${timeHTML(m.time)}</div>
    <div class="info"><span class="tag">${esc(tag)}</span><div class="opp">${esc(opp)}</div><div class="meta">${esc(where(m))}</div></div>
    ${trackable?`<div class="wl"><button data-id="${key}" data-v="w" aria-pressed="${v==="w"}" aria-label="Win">W</button><button data-id="${key}" data-v="l" aria-pressed="${v==="l"}" aria-label="Loss">L</button></div>`:"<div></div>"}
  </div>`;
}

function renderPicker(){
  const f=q.trim().toLowerCase();
  let html="";
  for(const p in POOLS){
    const list=TEAMS.filter(t=>t.pool===p&&(!f||t.name.toLowerCase().includes(f)));
    if(!list.length)continue;
    html+=`<div class="pool"><h3>Pool ${p}</h3>${list.map(t=>`<button class="team" data-team="${t.slug}">${esc(t.name.replace(/ \(([A-Z]{2})\)$/,""))}<span>${t.name.match(/\(([A-Z]{2})\)$/)?.[1]||""}</span></button>`).join("")}</div>`;
  }
  app.innerHTML=`<header>
      <div class="eyebrow">${esc(EVENT.name)}</div>
      <h1>Find your team</h1>
      <p>${esc(EVENT.dates)} · Xenia and Cedarville, OH · pick a team to see its schedule and every bracket path</p>
    </header>
    <input class="search" id="search" type="search" placeholder="Search 56 teams" value="${esc(q)}" autocomplete="off">
    <div class="pools" id="pools">${html||`<div class="empty">No team matches "${esc(q)}".</div>`}</div>
    ${footer()}`;
}

function footer(){
  return`<footer><div>Unofficial fan tracker. Schedule from <a href="${EVENT.source}" target="_blank" rel="noopener">ncsaa.org</a> as of ${EVENT.asOf}; check there for changes and live scores.</div>${NOTES.map(n=>`<div>${esc(n)}</div>`).join("")}<div>Results you tap are saved on this device only.</div></footer>`;
}

function renderTeam(){
  const t=team,P=t.pool;
  const mine=PP.filter(m=>m.pool===P&&(m.a===t.idx||m.b===t.idx));
  let w=0,l=0;const keys=[...mine.map(m=>m.key),"qf","am","pm"];
  keys.forEach(k=>{if(S[k]==="w")w++;if(S[k]==="l")l++});
  const mates=POOLS[P].filter((_,i)=>i!==t.idx);

  const byDay={thu:[],fri:[],sat:[]};
  mine.forEach(m=>{const o=POOLS[P][m.a===t.idx?m.b:m.a];byDay[m.day].push(row(m.key,m,"vs "+o,"Pool play"))});

  // seeds and paths
  const paths=[1,2,3,4].map(n=>{
    const src=P+"#"+n,qf=findBy(src);
    const win=findBy("W"+qf.id),loss=findBy("L"+qf.id);
    return{n,src,qf,win,loss};
  });
  const seed=S.seed,path=seed?paths[seed-1]:null;
  let sat="";
  if(path){
    byDay.fri.push(row("qf",path.qf,"vs "+srcText(other(path.qf,path.src)),label(path.qf)));
    const qfSrcW="W"+path.qf.id,qfSrcL="L"+path.qf.id;
    if(!S.qf){
      sat=`<div class="hint">Mark the quarterfinal to lock in Saturday.</div>`+
        row("am",path.win,"vs "+srcText(other(path.win,qfSrcW)),"If QF win · "+label(path.win),false)+
        row("am",path.loss,"vs "+srcText(other(path.loss,qfSrcL)),"If QF loss · "+label(path.loss),false);
    }else{
      const B=S.qf==="w"?path.win:path.loss,bs=(S.qf==="w"?"W":"L")+path.qf.id;
      sat=row("am",B,"vs "+srcText(other(B,bs)),label(B));
      const fw=findBy("W"+B.id),fl=findBy("L"+B.id);
      if(!S.am){
        sat+=`<div class="match ghost"><div class="time">${timeHTML(fw.time)}</div><div class="info"><span class="tag">Then</span><div class="opp">${esc(ROUND[fw.round])} or ${esc(ROUND[fl.round])}</div><div class="meta">${esc(EVENT.venues[fw.v].name)} · Court ${fw.ct} if win, Court ${fl.ct} if loss${fw.time!==fl.time?` (${fl.time})`:""}</div></div><div></div></div>`;
      }else{
        const F=S.am==="w"?fw:fl,fs=(S.am==="w"?"W":"L")+B.id;
        sat+=row("pm",F,"vs "+srcText(other(F,fs)),`Div ${F.div} ${ROUND[F.round]}`);
      }
    }
  }else{
    sat=`<div class="hint">Set the pool finish above to see Friday's quarterfinal and Saturday.</div>`;
  }
  const satVenue=path?EVENT.venues[path.win.v].name:"Venue depends on finish";
  const venueOf=d=>{const vs=[...new Set([...mine.filter(m=>m.day===d).map(m=>m.v),...(d==="fri"&&path?[path.qf.v]:[])])];return vs.map(v=>EVENT.venues[v].name).join(" + ")};

  const table=paths.map(p=>{
    const pm=(m)=>{const a=findBy("W"+m.id),b=findBy("L"+m.id);return a.time===b.time?a.time:`${a.time} / ${b.time}`};
    return`<tr><td>#${p.n} · Div ${p.qf.div}</td><td>${p.qf.time} Ct ${p.qf.ct}<br>${esc(EVENT.venues[p.qf.v].name)}<br>vs ${esc(srcText(other(p.qf,p.src)).replace(/ \(.*/,""))}</td><td>${esc(EVENT.venues[p.win.v].name)}<br>Semi ${p.win.time}${p.loss.time!==p.win.time?` / Cons ${p.loss.time}`:` (Cons same time)`}</td><td>${pm(p.win)===pm(p.loss)?pm(p.win):`Won semi: ${pm(p.win)}<br>Cons: ${pm(p.loss)}`}</td></tr>`;
  }).join("");

  app.innerHTML=`<header>
      <div class="toprow"><div class="eyebrow">Pool ${P} · ${esc(EVENT.name)}</div><div style="display:flex;gap:6px">${window.top===window?`<button class="linkbtn" id="share">Copy link</button>`:""}<button class="linkbtn" id="change">All teams</button></div></div>
      <h1>${esc(t.name)}</h1>
      <p>${esc(EVENT.dates)} · best of three · tap W or L as results come in</p>
      <p class="mates">Pool ${P}: ${mates.map(esc).join(", ")}</p>
      <div class="record"><b>${w}–${l}</b><span class="meta">record</span></div>
    </header>
    <section class="day"><div class="dayhead"><h2>${EVENT.days.thu}</h2><span>${venueOf("thu")}</span></div>${byDay.thu.join("")}</section>
    <section class="day"><div class="dayhead"><h2>Pool ${P} finish</h2><span>sets the bracket</span></div>
      <div class="seeds">${paths.map(p=>`<button data-seed="${p.n}" aria-pressed="${seed===p.n}"><b>#${p.n}</b><span>Div ${p.qf.div}</span></button>`).join("")}</div>
    </section>
    <section class="day"><div class="dayhead"><h2>${EVENT.days.fri}</h2><span>${venueOf("fri")}</span></div>${byDay.fri.join("")}</section>
    <section class="day"><div class="dayhead"><h2>${EVENT.days.sat}</h2><span>${esc(satVenue)}</span></div>${sat}</section>
    <section class="day"><div class="dayhead"><h2>All paths</h2><span>by pool finish</span></div>
      <div class="ref"><table><thead><tr><th>Finish</th><th>Fri QF</th><th>Sat AM</th><th>Sat PM</th></tr></thead><tbody>${table}</tbody></table></div>
    </section>
    <section class="venues">${Object.values(EVENT.venues).map(v=>`<div><b>${esc(v.name)}</b> · ${esc(v.addr)}</div>`).join("")}</section>
    <button class="linkbtn" id="reset" style="justify-self:start">Clear results for this team</button>
    ${footer()}`;
}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  team=TEAMS.find(t=>t.slug===h)||null;
  if(team){load();renderTeam();}else renderPicker();
  window.scrollTo(0,0);
}

app.addEventListener("input",e=>{
  if(e.target.id!=="search")return;
  q=e.target.value;const pos=e.target.selectionStart;
  renderPicker();const s=document.getElementById("search");s.focus();try{s.setSelectionRange(pos,pos)}catch(_){}
});
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.team){location.hash=b.dataset.team;return}
  if(b.id==="change"){location.hash="";return}
  if(b.id==="share"){navigator.clipboard?.writeText(location.href).then(()=>{b.textContent="Copied"},()=>{b.textContent="Copy failed"});return}
  if(b.dataset.seed){const n=+b.dataset.seed;if(S.seed===n)delete S.seed;else S.seed=n;delete S.qf;delete S.am;delete S.pm}
  else if(b.dataset.id){const id=b.dataset.id,v=b.dataset.v;if(S[id]===v)delete S[id];else S[id]=v;
    if(id==="qf"){delete S.am;delete S.pm}if(id==="am")delete S.pm}
  else if(b.id==="reset"){S={}}
  else return;
  save();renderTeam();
});
window.addEventListener("hashchange",route);
route();
</script>

</body>
</html>
