<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NCSAA Championship Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: single narrow column. Picker = pools grid; team view = day bands, one match per row with W/L toggles */
/* Red, white and blue: navy header band with red rule, red labels, blue for wins and selections. All text pairs meet WCAG AAA (7:1). */
:root{
  --bg:#ffffff; --card:#f4f7fc; --fg:#0f2347; --muted:#3d4a63; --line:#c9d3e6;
  --accent:#a00d25; --accent-soft:#fbe6e9; --blue:#1a3f99; --navy:#0f2a5c; --band-fg:#ffffff; --band-muted:#dbe4f5; --band-accent:#ffd0d6;
  --win:#1a3f99; --win-soft:#e4ecfa; --loss:#a00d25; --loss-soft:#fbe6e9;
  --win-fill:#1a3f99; --loss-fill:#a00d25; --sel-fill:#1a3f99;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1426; --card:#13203a; --fg:#eaf0fa; --muted:#b8c6de; --line:#2c3f66;
  --accent:#ff9eab; --accent-soft:#3a1620; --blue:#9dbbff; --navy:#13306b; --band-fg:#ffffff; --band-muted:#dbe4f5; --band-accent:#ffd0d6;
  --win:#9dbbff; --win-soft:#16264a; --loss:#ff9eab; --loss-soft:#3a1620;
  --win-fill:#24479f; --loss-fill:#a00d25; --sel-fill:#24479f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1426; --card:#13203a; --fg:#eaf0fa; --muted:#b8c6de; --line:#2c3f66;
  --accent:#ff9eab; --accent-soft:#3a1620; --blue:#9dbbff; --navy:#13306b; --band-fg:#ffffff; --band-muted:#dbe4f5; --band-accent:#ffd0d6;
  --win:#9dbbff; --win-soft:#16264a; --loss:#ff9eab; --loss-soft:#3a1620;
  --win-fill:#24479f; --loss-fill:#a00d25; --sel-fill:#24479f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4}
header{background:var(--navy);color:var(--band-fg);border-radius:10px;padding:16px;border-bottom:5px solid var(--accent)}
header .eyebrow{color:var(--band-accent)}
header p,header .meta,header .mates{color:var(--band-muted)}
header .linkbtn{color:var(--band-fg);border-color:rgba(255,255,255,.35)}
header .linkbtn:hover{color:var(--band-fg);border-color:var(--band-fg)}
header button:focus-visible{outline-color:var(--band-fg)}
.wrap{max-width:620px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:.02em}
header p{margin:4px 0 0;font-size:14px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{font:600 13px var(--body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 10px;cursor:pointer}
.linkbtn:hover{color:var(--fg);border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.record{display:flex;gap:8px;align-items:baseline;margin-top:10px;font-variant-numeric:tabular-nums}
.record b{font-family:var(--display);font-size:26px}
.meta{color:var(--muted);font-size:13px}
.day{display:grid;gap:8px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--blue);padding-bottom:4px}
.dayhead span{color:var(--muted);font-size:13px;text-align:right}
.match{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.match.w{background:var(--win-soft);border-color:var(--win)}
.match.l{background:var(--loss-soft);border-color:var(--loss)}
.match.ghost{background:transparent;border-style:dashed}
.time{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.time small{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em}
.info{min-width:0}
.opp{font-weight:700}
.tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:1px}
.wl{display:flex;gap:6px}
.wl button{font:700 14px var(--display);width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.wl button[data-v="w"][aria-pressed="true"]{background:var(--win-fill);border-color:var(--win-fill);color:#fff}
.wl button[data-v="l"][aria-pressed="true"]{background:var(--loss-fill);border-color:var(--loss-fill);color:#fff}
.seeds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seeds button{font-family:var(--display);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 4px;cursor:pointer;color:var(--fg);display:grid;gap:2px}
.seeds button b{font-size:22px;line-height:1}
.seeds button span{font-size:12px;color:var(--muted);letter-spacing:.05em}
.seeds button[aria-pressed="true"]{background:var(--sel-fill);border-color:var(--sel-fill);color:#fff}
.seeds button[aria-pressed="true"] span{color:#fff}
.finish{display:grid;gap:6px;padding-block:4px}
.finishhead{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.finishhead span{font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:13px;margin-left:6px}
.hint{font-size:13px;color:var(--muted);background:var(--win-soft);border-radius:6px;padding:8px 10px}
.ref{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:440px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--muted)}
td:first-child{font-weight:700;white-space:nowrap}
.venues{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.venues b{color:var(--fg)}
.meta a,.venues a{color:var(--blue);font-weight:700;white-space:nowrap}
.venue{display:grid;gap:2px}
footer{font-size:12px;color:var(--muted);display:grid;gap:4px;border-top:1px solid var(--line);padding-top:12px}
footer a{color:var(--blue);font-weight:600}
.srclink{display:inline-block;font-size:14px}
/* picker */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{font-family:var(--body);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;color:var(--fg);display:grid;gap:2px;min-width:0}
.tabs button b{font-family:var(--display);font-size:17px;letter-spacing:.02em}
.tabs button span{font-size:12px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--sel-fill);border-color:var(--sel-fill);color:#fff}
.tabs button[aria-pressed="true"] span{color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:420px){.tabs{grid-template-columns:1fr}}
.search::placeholder{color:var(--muted);opacity:1}
.search{width:100%;box-sizing:border-box;font:16px var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.pools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pool{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.pool h3{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 2px;color:var(--accent)}
.team{all:unset;cursor:pointer;padding:6px 8px;margin:0 -8px;border-radius:6px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.team:hover,.team:focus-visible{background:var(--win-soft)}
.team span{color:var(--muted);font-weight:400}
.empty{color:var(--muted);font-size:14px}
.mates{font-size:13px;color:var(--muted)}
@media (max-width:380px){.match{grid-template-columns:54px 1fr auto;gap:8px;padding:10px}.time{font-size:18px}}
</style>

</head>

const ROUND={OR:"Opening Round",RR:"Round Robin",QF:"Quarterfinal",SF:"Semifinal",CS:"Consolation Semifinal",CO:"Consolation",F:"Championship",T:"Third Place",C1:"Consolation 1st Place",C3:"Consolation 3rd Place"};
const PP=POOL_PLAY.trim().split("\n").map((l,i)=>{const[day,time,v,ct,pool,a,b]=l.split("|");return{key:"p"+i,day,time,v,ct,pool,a:+a,b:+b}});
const G={};for(const k in GAMES)G[k]=GAMES[k].trim().split("\n").map(l=>{const[id,div,round,day,time,v,ct,a,b]=l.split("|");return{id,div,round,day,time,v,ct,a,b}});
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short=n=>n.replace(/ \([A-Z]{2}\)$/,"");
const isTeam=s=>!/^([A-Z]?#\d|[WL]\d+)$/.test(s);

/* Teams per sport */
const TEAMS=[];
for(const p in POOLS)POOLS[p].forEach((n,i)=>TEAMS.push({sport:"volleyball",name:n,group:"Pool "+p,pool:p,idx:i,slug:slug(n)}));
const DIVORDER=["1/2","3","4","5","6"];
G["boys-soccer"].filter(g=>g.round==="OR").sort((x,y)=>DIVORDER.indexOf(x.div)-DIVORDER.indexOf(y.div)||+x.id-+y.id)
  .forEach(g=>[g.a,g.b].forEach(n=>TEAMS.push({sport:"boys-soccer",name:n,group:"Division "+g.div,slug:"boys-soccer-"+slug(n)})));
[...new Set(G["girls-soccer"].filter(g=>g.round==="RR").flatMap(g=>[g.a,g.b]))].sort()
  .forEach(n=>TEAMS.push({sport:"girls-soccer",name:n,group:"Round robin",slug:"girls-soccer-"+slug(n)}));

const app=document.getElementById("app");
let team=null,sport="volleyball",S={},q="";
function load(){try{S=JSON.parse(localStorage.getItem("vb26:"+team.slug))||{}}catch(e){S={}}}
function save(){try{localStorage.setItem("vb26:"+team.slug,JSON.stringify(S))}catch(e){}}

const mapUrl=v=>"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(v.place+", "+v.addr);
const dirLink=v=>`<a href="${mapUrl(v)}" target="_blank" rel="noopener" aria-label="Driving directions to ${esc(v.place)}">Directions</a>`;
const timeHTML=t=>{const[h,ap]=t.split(" ");return`${h}<small>${ap}</small>`};

function view(sp){
  const cfg=SPORTS[sp],games=G[sp];
  const find=src=>games.find(g=>g.a===src||g.b===src);
  const shortSrc=s=>{let m=/^([A-Z])#(\d)$/.exec(s);if(m)return`${m[1]} #${m[2]}`;m=/^#(\d)$/.exec(s);if(m)return`#${m[1]}`;if(/^[WL]\d+$/.test(s))return(s[0]==="W"?"Winner ":"Loser ")+s.slice(1);return short(s)};
  const srcText=s=>{
    let m=/^([A-Z])#(\d)$/.exec(s);if(m)return`Pool ${m[1]} #${m[2]}`;
    m=/^#(\d)$/.exec(s);if(m)return`#${m[1]} seed`;
    if(/^[WL]\d+$/.test(s)){const id=s.slice(1),x=games.find(b=>b.id===id);
      return`${s[0]==="W"?"Winner":"Loser"} of ${cfg.word} ${id}`+(x?` (${shortSrc(x.a)} / ${shortSrc(x.b)})`:"")}
    return s;
  };
  const label=g=>(g.div?`Div ${g.div} `:"")+ROUND[g.round]+(/^\d+$/.test(g.id)?` · ${cfg.word} ${g.id}`:"");
  const where=(g,court)=>{const v=EVENT.venues[g.v];return`${esc(v.name)} · ${court??cfg.unit+" "+g.ct}<br>${esc(v.addr)} · ${dirLink(v)}`};
  const keys=[];
  const row=(key,g,opp,tag,track=true)=>{
    if(track)keys.push(key);const v=track?S[key]:null;
    return`<div class="match ${v||""} ${track?"":"ghost"}">
      <div class="time">${timeHTML(g.time)}</div>
      <div class="info"><span class="tag">${esc(tag)}</span><div class="opp">${esc(opp)}</div><div class="meta">${where(g)}</div></div>
      ${track?`<div class="wl"><button data-id="${key}" data-v="w" aria-pressed="${v==="w"}" aria-label="Mark win">W</button><button data-id="${key}" data-v="l" aria-pressed="${v==="l"}" aria-label="Mark loss">L</button></div>`:"<div></div>"}
    </div>`};
  /* Follow a team through win/loss games: g = game, src = how the team is named in it, ks = state keys for each level */
  const chain=(days,g,src,ks)=>{
    const push=(d,h)=>(days[d]=days[d]||[]).push(h);
    push(g.day,row(ks[0],g,"vs "+srcText(g.a===src?g.b:g.a),label(g)));
    if(ks.length<2)return;
    const w=find("W"+g.id),l=find("L"+g.id);if(!w&&!l)return;
    const r=S[ks[0]];
    if(!r){
      if(w)push(w.day,row("",w,"vs "+srcText(w.a==="W"+g.id?w.b:w.a),"If win · "+label(w),false));
      if(l)push(l.day,row("",l,"vs "+srcText(l.a==="L"+g.id?l.b:l.a),"If loss · "+label(l),false));
      return;
    }
    const n=r==="w"?w:l;if(n)chain(days,n,(r==="w"?"W":"L")+g.id,ks.slice(1));
  };
  return{cfg,games,find,srcText,row,chain,keys,label};
}

function seedPicker(title,sub,opts,seed){
  return`<div class="finish"><div class="finishhead">${esc(title)} <span>${esc(sub)}</span></div>
    <div class="seeds">${opts.map(o=>`<button data-seed="${o.n}" aria-pressed="${seed===o.n}"><b>#${o.n}</b><span>${esc(o.sub)}</span></button>`).join("")}</div></div>`;
}

function renderTeam(){
  const t=team,sp=t.sport,V=view(sp),cfg=V.cfg,days={};
  const push=(d,h)=>(days[d]=days[d]||[]).push(h);
  let mates="",extra="",hints={};
  const seed=S.seed;

  if(sp==="volleyball"){
    const P=t.pool;
    mates=`Pool ${P}: `+POOLS[P].filter((_,i)=>i!==t.idx).join(", ");
    PP.filter(m=>m.pool===P&&(m.a===t.idx||m.b===t.idx)).forEach(m=>push(m.day,V.row(m.key,m,"vs "+POOLS[P][m.a===t.idx?m.b:m.a],"Pool play")));
    const paths=[1,2,3,4].map(n=>{const src=P+"#"+n,qf=V.find(src);return{n,src,qf,win:V.find("W"+qf.id),loss:V.find("L"+qf.id)}});
    push("fri",seedPicker(`Pool ${P} finish`,"sets the bracket",paths.map(p=>({n:p.n,sub:"Div "+p.qf.div})),seed));
    if(seed){const p=paths[seed-1];V.chain(days,p.qf,p.src,["qf","am","pm"])}
    else hints.sat="Set the pool finish under Friday to see the quarterfinal and Saturday.";
    const pm=m=>{const a=V.find("W"+m.id),b=V.find("L"+m.id);return a.time===b.time?a.time:`Won semi ${a.time}, cons ${b.time}`};
    extra=`<section class="day"><div class="dayhead"><h2>All paths</h2><span>by pool finish</span></div>
      <div class="ref"><table><thead><tr><th>Finish</th><th>Fri QF</th><th>Sat AM</th><th>Sat PM</th></tr></thead><tbody>${paths.map(p=>`<tr><td>#${p.n} · Div ${p.qf.div}</td><td>${p.qf.time} Ct ${p.qf.ct}<br>${esc(EVENT.venues[p.qf.v].name)}<br>vs ${esc(V.srcText(p.qf.a===p.src?p.qf.b:p.qf.a))}</td><td>${esc(EVENT.venues[p.win.v].name)}<br>Semi ${p.win.time}${p.loss.time!==p.win.time?`, cons ${p.loss.time}`:", cons same time"}</td><td>${pm(p.win)===pm(p.loss)?pm(p.win):`${pm(p.win)}<br>${pm(p.loss)}`}</td></tr>`).join("")}</tbody></table></div></section>`;
  }
  if(sp==="boys-soccer"){
    const g0=V.games.find(g=>g.round==="OR"&&(g.a===t.name||g.b===t.name));
    mates=`Division ${g0.div}`+(g0.div==="1/2"?": opening-round winners play for Division 1, losers for Division 2":"");
    V.chain(days,g0,t.name,["g1","g2","g3"]);
  }
  if(sp==="girls-soccer"){
    const rr=V.games.filter(g=>g.round==="RR"&&(g.a===t.name||g.b===t.name));
    mates="Round robin: "+TEAMS.filter(x=>x.sport===sp&&x.name!==t.name).map(x=>x.name).join(", ");
    rr.forEach(g=>push(g.day,V.row("r"+g.id,g,"vs "+(g.a===t.name?g.b:g.a),V.label(g))));
    push("thu",seedPicker("Final standing","sets Friday's game",[1,2,3,4].map(n=>({n,sub:n<3?"Title game":"3rd place"})),seed));
    if(seed){const g=V.find("#"+seed);V.chain(days,g,"#"+seed,["fin"])}
    else hints.fri="Set the final standing under Thursday to see Friday's game.";
  }

  let w=0,l=0;V.keys.forEach(k=>{if(S[k]==="w")w++;if(S[k]==="l")l++});
  const dayVenue=d=>{const html=(days[d]||[]).join("");const names=Object.values(EVENT.venues).filter((v,i,a)=>a.findIndex(x=>x.name===v.name)===i&&html.includes(esc(v.addr))).map(v=>v.name);return names.join(" + ")||(d==="sat"?"Venue depends on finish":"")};
  const sections=cfg.days.map(d=>`<section class="day"><div class="dayhead"><h2>${EVENT.days[d]}</h2><span>${esc(dayVenue(d))}</span></div>${(days[d]||[]).join("")}${hints[d]&&!(days[d]||[]).length?`<div class="hint">${esc(hints[d])}</div>`:""}</section>`).join("");
  const usedV=[...new Set(V.games.map(g=>g.v).concat(sp==="volleyball"?["aia","ced"]:[]))];

  app.innerHTML=`<header>
      <div class="toprow"><div class="eyebrow">${esc(t.group)} · NCSAA ${esc(cfg.full)}</div><div style="display:flex;gap:6px">${window.top===window?`<button class="linkbtn" id="share">Copy link</button>`:""}<button class="linkbtn" id="change">All teams</button></div></div>
      <h1>${esc(t.name)}</h1>
      <p>${esc(cfg.dates)} · ${esc(cfg.format)} · tap W or L as results come in</p>
      <p class="mates">${esc(mates)}</p>
      <div class="record"><b>${w}–${l}</b><span class="meta">record</span></div>
    </header>
    ${sections}
    ${extra}
    <section class="venues">${usedV.map(k=>EVENT.venues[k]).map(v=>`<div class="venue"><b>${esc(v.place)}</b><span>${esc(v.addr)} · ${dirLink(v)}</span></div>`).join("")}</section>
    <button class="linkbtn" id="reset" style="justify-self:start">Clear results for this team</button>
    ${footer(cfg.notes)}`;
}

function renderPicker(){
  const f=q.trim().toLowerCase(),cfg=SPORTS[sport];
  const list=TEAMS.filter(t=>t.sport===sport);
  const groups=[...new Set(list.map(t=>t.group))];
  let html="";
  groups.forEach(gname=>{
    const ts=list.filter(t=>t.group===gname&&(!f||t.name.toLowerCase().includes(f)));
    if(!ts.length)return;
    html+=`<div class="pool"><h3>${esc(gname)}</h3>${ts.map(t=>`<button class="team" data-team="${t.slug}">${esc(short(t.name))}<span>${t.name.match(/\(([A-Z]{2})\)$/)?.[1]||""}</span></button>`).join("")}</div>`;
  });
  app.innerHTML=`<header>
      <div class="eyebrow">${esc(EVENT.name)} 2026</div>
      <h1>Find your team</h1>
      <p>Xenia and Cedarville, OH · pick a team to see its schedule, every bracket path and directions</p>
    </header>
    <div class="tabs" role="group" aria-label="Sport">${Object.entries(SPORTS).map(([k,s])=>`<button data-sport="${k}" aria-pressed="${k===sport}"><b>${esc(s.label)}</b><span>${esc(s.dates.replace(", 2026",""))} · ${TEAMS.filter(t=>t.sport===k).length} teams</span></button>`).join("")}</div>
    <label class="sr" for="search">Search teams</label>
    <input class="search" id="search" type="search" placeholder="Search ${list.length} ${esc(cfg.label.toLowerCase())} teams" value="${esc(q)}" autocomplete="off">
    <div class="pools" id="pools">${html||`<div class="empty">No team matches "${esc(q)}".</div>`}</div>
    ${footer(cfg.notes)}`;
}

function footer(notes){
  return`<footer><a class="srclink" href="${EVENT.source}" target="_blank" rel="noopener">Official NCSAA schedule and live scores</a><div>Unofficial fan tracker. Schedule copied from ncsaa.org on ${EVENT.asOf}; the official page has any changes.</div>${(notes||[]).map(n=>`<div>${esc(n)}</div>`).join("")}<div>Results you tap are saved on this device only.</div></footer>`;
}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  team=TEAMS.find(t=>t.slug===h)||null;
  if(team){sport=team.sport;load();renderTeam();}
  else{sport=SPORTS[h]?h:"volleyball";renderPicker();}
  window.scrollTo(0,0);
}

app.addEventListener("input",e=>{
  if(e.target.id!=="search")return;
  q=e.target.value;const pos=e.target.selectionStart;
  renderPicker();const s=document.getElementById("search");s.focus();try{s.setSelectionRange(pos,pos)}catch(_){}
});
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.team){location.hash=b.dataset.team;return}
  if(b.dataset.sport){q="";location.hash=b.dataset.sport==="volleyball"?"":b.dataset.sport;if(b.dataset.sport==="volleyball"){sport="volleyball";renderPicker()}return}
  if(b.id==="change"){location.hash=team.sport==="volleyball"?"":team.sport;if(team.sport==="volleyball"){team=null;sport="volleyball";renderPicker()}return}
  if(b.id==="share"){navigator.clipboard?.writeText(location.href).then(()=>{b.textContent="Copied"},()=>{b.textContent="Copy failed"});return}
  if(b.dataset.seed){const n=+b.dataset.seed;if(S.seed===n)delete S.seed;else S.seed=n;["qf","am","pm","fin"].forEach(k=>delete S[k])}
  else if(b.dataset.id){const id=b.dataset.id,v=b.dataset.v;if(S[id]===v)delete S[id];else S[id]=v;
    const order=[["qf","am","pm"],["g1","g2","g3"]];order.forEach(o=>{const i=o.indexOf(id);if(i>=0)o.slice(i+1).forEach(k=>delete S[k])})}
  else if(b.id==="reset"){S={}}
  else return;
  save();renderTeam();
});
window.addEventListener("hashchange",route);
route();
