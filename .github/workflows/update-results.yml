name: Update tournament results

# Reads posted scores from the NCSAA event page and redeploys the tracker when they change.
# The script only does work inside the tournament window (Wed 6 AM to Sun 2 AM ET);
# outside it each run exits in seconds. Run it by hand from the Actions tab any time.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the tournament window"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read results from ncsaa.org
        id: results
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: node scripts/update-results.mjs

      - name: Commit results.json
        if: steps.results.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          git commit -m "Update results from ncsaa.org"
          git pull --rebase origin main
          git push

      # Pushes made by this workflow don't trigger the regular deploy, so deploy here.
      - name: Deploy to Azure Static Web Apps
        if: steps.results.outputs.changed == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_GRASS_0943B670F }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "."
          skip_app_build: true
